name: Publicar no GitHub Pages

# ATENÇÃO — passo manual necessário uma única vez:
# Settings → Pages → Build and deployment → Source → "GitHub Actions".
# Enquanto estiver em "Deploy from a branch", o Pages serve o README pelo
# Jekyll em vez do site, e o Jekyll ainda ignora pastas iniciadas por `_`
# (como `_next`) — o que quebraria os assets mesmo que o build subisse.

on:
  push:
    branches:
      - main
      - claude/bormann-jr-premium-site-i25vzv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; sem cancelar a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar (lint + tipos)
        run: |
          npm run lint
          npm run typecheck

      # Sem otimizador em tempo de requisição num host estático: as variantes
      # responsivas são geradas aqui e o loader personalizado aponta para elas.
      - name: Gerar variantes de imagem
        run: npm run images:web

      - name: Build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /bormannjrconcept
          NEXT_PUBLIC_SITE_URL: https://vinikunze.github.io/bormannjrconcept
        run: npx next build

      # Sem isto o Pages passa a saída pelo Jekyll, que ignora `_next/`.
      - name: Desligar o Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Validar e publicar demonstração

on:
  push:
    branches:
      - main
      - claude/bormann-jr-premium-site-i25vzv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - name: Identificar o modo de publicação existente
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages(context.repo);
            core.setOutput('build_type', data.build_type);
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      - name: Exportar demonstração estática
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:pages
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    if: needs.build.outputs.pages_build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
